name: Java CI with Gradle

# dev 브랜치에 push, pr 될 때 트리거
on:
  push:
    branches: ["dev"]

env:
  AZURE_APP_NAME: homis-be

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- CI
      # JDK 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: "temurin"

      - name: Gradle Caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 빌드 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 빌드 디렉토리 정리

      # 빌드 및 테스트
      - name: Build with Gradle
        run: ./gradlew clean build -x test  # 이전 내용 삭제, 테스트 스킵하여 빌드

      # --- CD 실행
      - name: Azure WebApp
        uses: Azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: build/libs/*-SNAPSHOT.jar  # jar 파일 지정 - 실행용