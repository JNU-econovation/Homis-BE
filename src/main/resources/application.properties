spring.application.name=ddeugae
spring.datasource.url=${AZURE_MYSQL_URL}
spring.datasource.username=${AZURE_MYSQL_USERNAME}
spring.datasource.password=${AZURE_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.show_sql=true
spring.jpa.hibernate.ddl-auto=update

spring.cloud.azure.storage.blob.container-name=homis-file
spring.cloud.azure.storage.blob.connection-string=${AZURE_STORAGE_CONNECTION}

password.encode.algorithm=${PWD_ALGORITHM}
password.encode.iterations=100000
password.encode.keyLength=256

jwt.secretKey=${JWT_SECRET}

websnap.auth.token=${WEBSNAP_AUTH_TOKEN}